name: Refresh market data

on:
  schedule:
    # 06:00 UTC on the 1st of every month (Zillow publishes monthly).
    - cron: "0 6 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-market-data
  cancel-in-progress: false

jobs:
  refresh:
    name: Rebuild Zillow snapshot
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Rebuild market snapshot
        run: python scripts/build_market_snapshot.py --redownload

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain market_data)" ]; then
            git add market_data
            git commit -m "chore: refresh Zillow market snapshot"
            git push
          else
            echo "No market data changes to commit."
          fi
