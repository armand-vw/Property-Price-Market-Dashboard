[project]
name = "property-price-market-dashboard"
version = "1.0.0"
description = "Real Estate Price Estimator & Market Insights Dashboard — Streamlit, XGBoost, scikit-learn, Plotly."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "armand-vw", email = "armand.vanwyk001@gmail.com" }]
keywords = [
    "machine-learning",
    "real-estate",
    "xgboost",
    "streamlit",
    "plotly",
    "price-prediction",
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "streamlit==1.64.0",
    "plotly==7.1.0",
    "xgboost==3.4.1",
    "scikit-learn==1.9.1",
    "pandas==3.0.6",
    "numpy==2.5.3",
    "joblib==1.6.0",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "matplotlib"]

[project.urls]
Homepage = "https://armand-vw.github.io/Property-Price-Market-Dashboard/"
Repository = "https://github.com/armand-vw/Property-Price-Market-Dashboard"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# --------------------------------------------------------------------------- #
# Tooling
# --------------------------------------------------------------------------- #
[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", "docs", "market_data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "W"]
# C408: `dict(...)` reads better than `{...}` for Plotly keyword styling.
ignore = ["E501", "C408"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
